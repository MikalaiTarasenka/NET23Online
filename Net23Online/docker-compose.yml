services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: net23-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1' -C -b || /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1' -C -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  animalapi:
    build:
      context: .
      dockerfile: AnimalWorldMinimalApi/Dockerfile.api
    container_name: net23-animalapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=db;Database=WebNet23AnimalFacts;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
    ports:
      - "5001:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: WebNet23Online/Dockerfile.web
    container_name: net23-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=db;Database=WebNet23Online;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - ApiEndpoints__FactsApi=http://animalapi:8080
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
      animalapi:
        condition: service_started

volumes:
  sqlserver-data: